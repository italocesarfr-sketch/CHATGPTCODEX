name: NOcTuA — inicialização comercial, somente ambiente descartável
on:
  push:
    branches: [sync/academic-commercial-auto-031, sync/academic-commercial-final-033, sync/academic-commercial-onboarding-034]
    paths: ['app/**', 'scripts/**commercial**', 'scripts/ci/**commercial**', 'scripts/ci/*launcher*', 'supabase/migrations/202611220001_institutional_provisioning.sql', 'supabase/migrations/202611170001_commercial_bootstrap.sql', '.github/workflows/commercial-auto-local.yml']
  workflow_dispatch:
    inputs:
      launcher_only:
        description: 'Somente diagnóstico do launcher em AVD vazio; não aprova regressão comercial'
        type: boolean
        default: false
      ui_diagnostic_only:
        description: 'Somente launcher e troca A/B/A em AVD novo e backend descartável; não aprova regressão completa'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local-proof:
    if: (github.ref == 'refs/heads/sync/academic-commercial-auto-031' || github.ref == 'refs/heads/sync/academic-commercial-final-033' || github.ref == 'refs/heads/sync/academic-commercial-onboarding-034') && inputs.launcher_only != true && (inputs.ui_diagnostic_only != true || github.ref == 'refs/heads/sync/academic-commercial-onboarding-034')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: noctua_phase_e_test
        ports: ['55431:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '55431'
      PGUSER: postgres
      PGPASSWORD: local-fixture-only
      PGDATABASE: noctua_phase_e_test
      NOCTUA_COMMERCIAL_DISPOSABLE: 'YES'
      NOCTUA_ONBOARDING_LOCAL: ${{ github.ref == 'refs/heads/sync/academic-commercial-onboarding-034' && 'YES' || 'NO' }}
      NOCTUA_COMMERCIAL_FINAL: ${{ (github.ref == 'refs/heads/sync/academic-commercial-final-033' || github.ref == 'refs/heads/sync/academic-commercial-onboarding-034') && 'YES' || 'NO' }}
      NOCTUA_AUTH_LIVE_FILE: ''
      NOCTUA_HOMOLOGACAO_AUTH_TEST_FILE: ''
      NOCTUA_HOMOLOGACAO_AUTH_TEST_AUTHORIZED: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Geometria real e densidade do launcher
        if: github.ref == 'refs/heads/sync/academic-commercial-onboarding-034'
        run: python3 scripts/test-launcher-geometry.py
      - name: JVM com configuração padrão desligada
        if: inputs.ui_diagnostic_only != true
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon testDebugUnitTest
          mkdir -p build/commercial-tests/default-jvm
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml build/commercial-tests/default-jvm/
      - name: PostgreSQL real — autorização, concorrência e predicados originais
        if: inputs.ui_diagnostic_only != true
        run: |
          python3 scripts/test-commercial-bootstrap.py > build/commercial-tests/postgres-results.txt 2>&1
          tail -5 build/commercial-tests/postgres-results.txt
          createdb noctua_phase_d_test
          PGDATABASE=noctua_phase_d_test python3 scripts/test-commercial-regression.py > build/commercial-tests/regression-d.txt 2>&1
          tail -5 build/commercial-tests/regression-d.txt
      - name: Provisionamento institucional — somente banco descartável
        if: github.ref == 'refs/heads/sync/academic-commercial-onboarding-034'
        run: |
          mkdir -p build/commercial-tests
          # The previous battery ends at E; this battery tests migrations from an empty fixture.
          # This database exists only inside this job's disposable PostgreSQL service.
          [[ "$GITHUB_ACTIONS" == true && "$CI" == true && "$PGHOST" == 127.0.0.1 && "$PGPORT" == 55431 && "$PGDATABASE" == noctua_phase_e_test && "$NOCTUA_COMMERCIAL_DISPOSABLE" == YES ]]
          dropdb noctua_phase_e_test
          createdb noctua_phase_e_test
          python3 scripts/test-commercial-provisioning.py > build/commercial-tests/provisioning.txt 2>&1
          tail -5 build/commercial-tests/provisioning.txt
      - name: HTTP real descartável e fixture Android sem allowlist de testes
        run: bash scripts/ci/start-commercial-postgrest.sh
      - name: Opt-in somente neste build debug; nenhuma assinatura oficial
        run: |
          if [[ '${{ inputs.ui_diagnostic_only }}' == true ]]; then
            ./gradlew --no-daemon -PnoctuaAcademicCommercial=true assembleDebug assembleDebugAndroidTest
          else
            ./gradlew --no-daemon -PnoctuaAcademicCommercial=true testDebugUnitTest assembleDebug assembleDebugAndroidTest
          fi
          python3 scripts/validate-auth-apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: KVM do runner descartável
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: noctua_commercial_auto_${{ github.run_id }}_${{ github.run_attempt }}
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -memory 2048 -cores 2
          script: bash scripts/ci/${{ inputs.ui_diagnostic_only == true && 'test-commercial-ui-diagnostic.sh' || 'test-commercial-android.sh' }}
      - name: Parar somente servidor descartável deste job
        if: always()
        run: |
          if [[ -f build/commercial-tests/postgrest.pid ]]; then kill "$(cat build/commercial-tests/postgrest.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-auto-local-evidence
          path: |
            build/commercial-tests/default-jvm/
            build/commercial-tests/postgres-results.txt
            build/commercial-tests/regression-d.txt
            build/commercial-tests/provisioning.txt
            build/commercial-tests/http-results.json
            build/commercial-tests/android/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
  launcher-diagnostic:
    name: Diagnóstico do launcher — não substitui regressão completa
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/academic-commercial-onboarding-034' && inputs.launcher_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: APK apenas para AVD vazio, sem credenciais ou assinatura oficial
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python3 scripts/test-launcher-geometry.py
          ./gradlew --no-daemon assembleDebug
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: noctua_onboarding_launcher_${{ github.run_id }}_${{ github.run_attempt }}
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -memory 2048 -cores 2
          script: python3 scripts/ci/test-launcher-icon.py --apk app/build/outputs/apk/debug/app-debug.apk --package br.com.diariodeclasse --label Noctua --input-control --output build/onboarding-launcher-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-launcher-diagnostic-only
          path: build/onboarding-launcher-diagnostic/
          if-no-files-found: warn
          retention-days: 7
