name: NOcTuA — preparação local da atualização c40
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  local-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/academic-complete-0220'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOCTUA_H05_AVD_NAME: noctua_h05_local_${{ github.run_id }}_${{ github.run_attempt }}
      NOCTUA_AUTH_LIVE_FILE: ''
      NOCTUA_HOMOLOGACAO_AUTH_TEST_FILE: ''
      NOCTUA_HOMOLOGACAO_AUTH_TEST_AUTHORIZED: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Guardas sem credenciais
        run: python3 scripts/test-official-upgrade-preparation.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41228898103
          name: noctua-sync-foundation-homologacao
          path: .c40-baseline
      - name: APK original, cópia reassinada e release de teste — somente chave descartável
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python3 scripts/official-upgrade-local.py prepare
      - name: Aceleração do AVD novo
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          avd-name: ${{ env.NOCTUA_H05_AVD_NAME }}
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: python3 scripts/official-upgrade-local.py execute
      - name: Remover somente arquivos privados desta prova e APKs de teste
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/noctua-c40-upgrade-private" .c40-baseline
          rm -f app/build/outputs/apk/release/*.apk app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c40-atualizacao-descartavel-sanitizada
          path: build/official-upgrade/*.json
          if-no-files-found: error
          retention-days: 14
