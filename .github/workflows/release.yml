name: APK com assinatura estável
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Preparar chave fora do repositório
        env:
          STORE_B64: ${{ secrets.DIARY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DIARY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DIARY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DIARY_KEY_PASSWORD }}
          CERT_SHA: ${{ vars.DIARY_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib,sys
          if not all(os.environ.get(k) for k in ['STORE_B64','STORE_PASS','KEY_ALIAS','KEY_PASS','CERT_SHA']):
              sys.exit('Assinatura estável não configurada. Nenhuma chave temporária será criada.')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'diario-signing.p12'
          p.write_bytes(base64.b64decode(os.environ['STORE_B64'],validate=True))
          p.chmod(0o600)
          PY
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testar e compilar release
        env:
          DIARY_RELEASE_STORE_FILE: ${{ runner.temp }}/diario-signing.p12
          DIARY_RELEASE_STORE_PASSWORD: ${{ secrets.DIARY_STORE_PASSWORD }}
          DIARY_RELEASE_KEY_ALIAS: ${{ secrets.DIARY_KEY_ALIAS }}
          DIARY_RELEASE_KEY_PASSWORD: ${{ secrets.DIARY_KEY_PASSWORD }}
          DIARY_RELEASE_CERT_SHA256: ${{ vars.DIARY_CERT_SHA256 }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Verificar APK e certificado fixado
        env:
          EXPECTED_CERT: ${{ vars.DIARY_CERT_SHA256 }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify-release-certificate.py app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: diario-de-classe-assinatura-estavel
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
      - name: Remover material privado do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/diario-signing.p12"
