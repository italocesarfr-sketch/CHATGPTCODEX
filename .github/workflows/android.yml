name: Compilar APK Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Etapa 1 — backup, banco, assinatura e atualização
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar e executar testes de regras e backup
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Comprovar bloqueio de release sem assinatura configurada
        run: |
          mkdir -p build
          if ./gradlew --no-daemon preReleaseBuild > build/release-blocked.txt 2>&1; then
            echo "ERRO: release sem chave deveria ter sido bloqueado" >&2
            exit 1
          fi
          python3 - <<'PYGUARD'
          from pathlib import Path
          text=Path('build/release-blocked.txt').read_text()
          assert 'Release bloqueado: configure a chave estável' in text
          print('Bloqueio de release sem chave comprovado.')
          PYGUARD
      - name: Conferir que o esquema Room v1 continua idêntico
        run: git diff --exit-code -- app/schemas
      - uses: actions/checkout@v4
        with:
          ref: a157c79c0823f898c63133ac6ff35bf5793b5219
          path: .baseline-source
      - name: Compilar referência com a mesma chave descartável de teste
        run: |
          chmod +x .baseline-source/gradlew
          .baseline-source/gradlew -p .baseline-source --no-daemon assembleDebug
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build/apk-tested.sha256
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
            ./scripts/ci/test-upgrade.sh
      - name: Verificar o APK testado, assinatura e compatibilidade da referência
        run: |
          sha256sum -c build/apk-tested.sha256
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          python3 scripts/apk_identity.py app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/identidade-apk.json
          python3 scripts/report-baseline-compatibility.py app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/compatibilidade-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: diario-de-classe-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/identidade-apk.json
            app/build/outputs/apk/debug/compatibilidade-baseline.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-etapa1
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/upgrade-identity.json
            build/upgrade-before.txt
            build/upgrade-after.txt
            build/release-blocked.txt
          if-no-files-found: ignore
