name: Diagnóstico de testes fictícios
on:
  push:
    branches: [codex/prompt2-diagnostico]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: italocesarfr-sketch/CHATGPTCODEX
          run-id: 39331441506
          name: resultados-etapa6
          path: diagnostic
      - name: Ler falhas e capturas sem executar o aplicativo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E,tarfile,base64
          for p in Path('diagnostic/app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              for case in E.parse(p).getroot().findall('testcase'):
                  failure=case.find('failure')
                  if failure is not None:
                      print('FAILURE_CASE:',case.get('classname'),case.get('name'))
                      print(failure.text)
          p=Path('diagnostic/build/prompt2-telas.tar')
          if p.exists():
              with tarfile.open(p) as tar:
                  for member in tar.getmembers():
                      if member.isfile() and member.name.endswith('.png'):
                          print('FIXTURE_IMAGE:',member.name,base64.b64encode(tar.extractfile(member).read()).decode())
          PY
