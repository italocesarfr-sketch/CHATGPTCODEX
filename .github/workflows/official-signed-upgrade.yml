name: NOcTuA — preflight protegido e candidato oficial c45
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: PREFLIGHT
      reviewed_sha:
        type: string
        required: true
      authorize_signing_preflight:
        type: boolean
        default: false
      authorize_signed_candidate:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: noctua-permanent-signing-release
  cancel-in-progress: false
env:
  NOCTUA_SIGNING_MODE: ${{ inputs.mode }}
  NOCTUA_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
  NOCTUA_AUTHORIZE_PREFLIGHT: ${{ inputs.authorize_signing_preflight }}
  NOCTUA_AUTHORIZE_CANDIDATE: ${{ inputs.authorize_signed_candidate }}
jobs:
  policy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/academic-complete-0220'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Testes sintéticos de segurança — nenhuma chave
        run: python3 scripts/test-official-signing.py
      - name: Conferir proteções antes de admitir o job que acessa Secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/official-signing.py policy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: politica-assinatura-sanitizada
          path: build/official-signed/*.json
          if-no-files-found: ignore
          retention-days: 14
  protected:
    needs: policy
    environment: release
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOCTUA_H05_AVD_NAME: noctua_h05_local_${{ github.run_id }}_${{ github.run_attempt }}
      NOCTUA_AUTH_LIVE_FILE: ''
      NOCTUA_HOMOLOGACAO_AUTH_TEST_FILE: ''
      NOCTUA_HOMOLOGACAO_AUTH_TEST_AUTHORIZED: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Revalidar proteções após aprovação e antes de mapear Secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/official-signing.py policy
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: inputs.mode == 'CANDIDATE'
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        if: inputs.mode == 'CANDIDATE'
        with:
          cache-disabled: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.mode == 'CANDIDATE'
        with:
          github-token: ${{ github.token }}
          run-id: 41228898103
          name: noctua-sync-foundation-homologacao
          path: .c40-baseline
      - name: SDK do ensaio, antes de mapear a chave
        if: inputs.mode == 'CANDIDATE'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verificar somente a assinatura existente, ou preparar candidato autorizado
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_B64: ${{ secrets.DIARY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DIARY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DIARY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DIARY_KEY_PASSWORD }}
          CERT_SHA: ${{ vars.DIARY_CERT_SHA256 }}
        run: |
          case "$NOCTUA_SIGNING_MODE" in
            PREFLIGHT) python3 scripts/official-signing.py preflight ;;
            CANDIDATE) python3 scripts/official-signing.py prepare ;;
            *) exit 1 ;;
          esac
      - name: Aceleração do AVD descartável
        if: inputs.mode == 'CANDIDATE'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        if: inputs.mode == 'CANDIDATE'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 30
          arch: x86_64
          avd-name: ${{ env.NOCTUA_H05_AVD_NAME }}
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: python3 scripts/official-signing.py execute
      - name: Conferir novamente o APK e aprovar somente o candidato ensaiado
        if: inputs.mode == 'CANDIDATE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/official-signing.py approve
      - name: Remover chave, instrumentação privilegiada e logs privados
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/noctua-c40-upgrade-private" .c40-baseline
          rm -f app/build/outputs/apk/release/*.apk app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && inputs.mode == 'CANDIDATE'
        with:
          name: noctua-0.22.0-c45-candidato-assinado
          path: build/official-signed/candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verificacao-assinatura-sanitizada
          path: build/official-signed/*.json
          if-no-files-found: ignore
          retention-days: 14
